[package]
name = "meowprint-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND OFL-1.1"
authors.workspace = true
description = "Render and print images, text, and QR codes on Bluetooth thermal printers"
readme = "README.md"
keywords = ["bluetooth", "thermal", "printer", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["src/**", "assets/**", "tests/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[lints]
workspace = true

[[bin]]
name = "meowprint"
path = "src/main.rs"
doc = false

[dependencies]
meowprint = { path = "../meowprint", version = "0.1.0", default-features = false, features = ["bluetooth", "image"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
qrcode = { version = "0.14", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
rqrr = "0.10"
