[package]
name = "meowprint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Rust library for printing on Bluetooth cat printers"
readme = "README.md"
documentation = "https://docs.rs/meowprint"
keywords = ["bluetooth", "thermal", "printer", "raster", "ble"]
categories = ["hardware-support", "encoding"]
include = ["src/**", "examples/**", "tests/**", "docs/protocol.md", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[lints]
workspace = true

[features]
default = ["bluetooth"]
std = ["thiserror/std"]
tokio = ["std", "dep:tokio"]
bluetooth = ["tokio", "dep:btleplug", "dep:futures-util", "dep:uuid"]
image = ["std", "dep:image"]

[[example]]
name = "bluetooth"
required-features = ["bluetooth"]

[[example]]
name = "query"
required-features = ["bluetooth"]

[[example]]
name = "preview"
required-features = ["image"]

[[example]]
name = "load_image"
required-features = ["image"]

[[example]]
name = "custom_transport"
required-features = ["tokio"]

[[test]]
name = "jobs"
required-features = ["tokio"]

[dependencies]
btleplug = { version = "0.13.2", optional = true }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
futures-util = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, optional = true }
lzokay = { version = "2", default-features = false, features = ["compress", "alloc"] }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "macros", "time"] }
uuid = { version = "1", optional = true }

[target.'cfg(target_has_atomic = "ptr")'.dependencies]
atomic-waker = { version = "1.1.2", default-features = false }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
lzokay = { version = "2", default-features = false, features = ["decompress"] }
