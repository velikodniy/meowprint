[package]
name = "meowprint-portable"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[features]
default = []
std = ["meowprint/std"]
image = ["std", "meowprint/image"]
host = ["dep:futures-lite"]

[dependencies]
meowprint = { path = "../../crates/meowprint", default-features = false }
embassy-time = { version = "0.5.1", default-features = false, features = ["tick-hz-1_000_000", "generic-queue-8"] }
futures-lite = { version = "2", optional = true }

[target.'cfg(not(any(target_family = "wasm", target_os = "none")))'.dependencies]
embassy-time = { version = "0.5.1", default-features = false, features = ["tick-hz-1_000_000", "generic-queue-8", "std"] }
critical-section = { version = "1", features = ["std"] }

[target.'cfg(target_family = "wasm")'.dependencies]
embassy-time = { version = "0.5.1", default-features = false, features = ["tick-hz-1_000_000", "generic-queue-8", "wasm"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[example]]
name = "stream"
required-features = ["host"]
